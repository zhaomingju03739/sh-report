function f0(v){return Math.round(v).toLocaleString('en-US');}
function fmt(d){return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);}
function md(d){return +d.slice(4,6)+'/'+ +d.slice(6);}
function sgn(v){if(Math.abs(v)<0.5)return '<span class="z">0</span>';
  return '<span class="'+(v>0?'up':'dn')+'">'+(v>0?'+':'')+f0(v)+'</span>';}
function pct(a,b){return b?(a/b*100).toFixed(0)+'%':'0%';}

// ---- 时间基准：相对当前所选日期，取"不晚于目标日的最近可用日期" ----
// ⚠️函数名不可叫 pick——与仓库筛选的 pick(k,v,on) 重名会互相覆盖
function pickIdx(t){for(let i=DATES.length-1;i>=0;i--){if(DATES[i]<=t)return i;}return -1;}
function shift(d,n){const dt=new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6));
  dt.setDate(dt.getDate()+n);
  return ''+dt.getFullYear()+String(dt.getMonth()+1).padStart(2,'0')+
    String(dt.getDate()).padStart(2,'0');}
function bases(){
  const cur=DATES[IDX], out=[];
  const y=pickIdx(shift(cur,-1)),w7=pickIdx(shift(cur,-7)),m=pickIdx(cur.slice(0,6)+'01');
  if(y>=0&&y!==IDX)out.push(['较昨日',y]);
  if(w7>=0&&w7!==IDX)out.push(['较上周',w7]);
  if(m>=0&&m!==IDX)out.push(['较月初',m]);
  return out;}
// 本月累计的日期下标（当前所选日期所属月的1日~当前日）
function monthIdx(){const mo=DATES[IDX].slice(0,6),o=[];
  for(let i=0;i<=IDX;i++){if(DATES[i].slice(0,6)===mo)o.push(i);}return o;}

// ---- 聚合：一批仓 → 各指标（取当前日期下标 IDX） ----
function agg(rows){
  const B=bases(), MI=monthIdx();
  const a={n:rows.length,st:0,e:0,y:0,can:0,no:0,y_no:0,qd:0,qm:0,sd:0,sm:0,
           c:B.map(()=>0)};
  rows.forEach(r=>{
    a.st+=r.st[IDX];a.e+=r.e[IDX];a.y+=r.y[IDX];
    if(r.ok==='是')a.can+=r.e[IDX];
    if(r.ok==='否'){a.no+=r.e[IDX];a.y_no+=r.y[IDX];}
    a.qd+=r.q[IDX];a.sd+=r.s[IDX];
    MI.forEach(i=>{a.qm+=r.q[i];a.sm+=r.s[i];});
    B.forEach((b,bi)=>{a.c[bi]+=r.e[IDX]-r.e[b[1]];});});
  return a;}
// 收车（当日/本月）：维度值必须用核验字段口径 SCDIM，仓库加总会漏未匹配仓名的收车
function scOf(dim,val){
  const arr=(SCDIM[dim]||{})[val];
  if(!arr)return {d:0,m:0};
  let m=0;monthIdx().forEach(i=>m+=arr[i]);
  return {d:arr[IDX],m:m};}
function scCity(){let m=0;monthIdx().forEach(i=>m+=SCCITY[i]);
  return {d:SCCITY[IDX],m:m};}


// ---- 目标与达成（⚠️反向指标：存量实际≤目标才算达成；达成率=目标/实际） ----
// ⭐单日达成率：存量本身是时点值，故"实际"取**所选那一天**的≥24年存量，

//   早于首周取首周、晚于末周取末周（同 goals.py 兜底规则）。
// 无目标的项（如"未匹配"）显示 —，不当0。
function pickGoalWeek(){
  if(!GOAL_WEEKS||!GOAL_WEEKS.length){GOAL=null;return;}
  const cur=DATES[IDX];
  let g=GOAL_WEEKS.find(w=>cur>=w.start&&cur<=w.end);
  if(!g)g=(cur<GOAL_WEEKS[0].start)?GOAL_WEEKS[0]:GOAL_WEEKS[GOAL_WEEKS.length-1];
  GOAL=g;}
function gv(dim,key){
  if(!GOAL)return null;
  const m=dim==='city'?null:GOAL[dim];
  const v=dim==='city'?GOAL.city:(m?m[key]:null);
  return (v===undefined||v===null)?null:v;}
function goalTh(){
  return GOAL?('<th class="g6">目标<br><span style="font-weight:400;opacity:.8">'+
    GOAL.week+'</span></th><th class="g6">单日达成率<br>'+
    '<span style="font-weight:400;opacity:.8">'+md(DATES[IDX])+'</span></th>'):'';}
// ⚠️反向指标除以实际，实际=0 时不能算率（会 Infinity）→ 显示"达成"
function rateTxt(t,act){
  if(!act)return '达成';
  return (t/act*100).toFixed(0)+'%';}
function goalTd(dim,key,act){
  if(!GOAL)return '';
  const t=gv(dim,key);
  if(t===null)return '<td class="gt">—</td><td class="gt">—</td>';
  const ok=act<=t+0.5;
  return '<td class="gt">'+f0(t)+'</td>'+
    '<td class="'+(ok?'gok':'gbad')+'" title="'+md(DATES[IDX])+
    ' 当日实际 '+f0(act)+' vs 本周目标 '+f0(t)+'（'+GOAL.week+'）（差 '+
    (act-t>0?'+':'')+f0(act-t)+'）'+
    (ok?'，已达成':'，未达成')+'">'+rateTxt(t,act)+'</td>';}

  '<td class="e">'+f0(a.e)+'</td>'+goalTd(dim,key,a.e)+
  '<td class="y">'+f0(a.y)+'</td>'+
  '<td>'+f0(a.can)+'</td><td class="no">'+f0(a.no)+'</td>'+
  '<td>'+pct(a.no,a.e)+'</td><td class="y">'+f0(a.y_no)+'</td>'+
  '<td class="s">'+f0(sc.d)+'</td><td class="s">'+f0(sc.m)+'</td>'+
  '<td class="q">'+f0(a.qd)+'</td><td class="q">'+f0(a.qm)+'</td>'+
  a.c.map(v=>'<td>'+sgn(v)+'</td>').join('');}
// ⚠️列数用 HAS_GOAL（是否有目标数据），不能用 GOAL——它在 pickGoalWeek 后才赋值
function ncol(){return 15+bases().length+(HAS_GOAL?2:0);}

function renderCity(){
  const a=agg(WARES), sc=scCity();
  document.getElementById('t_city').innerHTML=
    '<table><thead><tr><th class="l">城市</th>'+th()+'</tr></thead><tbody>'+
    '<tr class="sum"><td class="l"><span class="nm">上海城市群</span></td>'+
    cells(a,sc,'city','')+'</tr></tbody></table>';}

function groupBy(rows,k){const o={};rows.forEach(r=>{(o[r[k]]=o[r[k]]||[]).push(r);});return o;}

function renderZone(){
  const g=groupBy(WARES,'z');
  const ks=Object.keys(g).sort((x,y)=>agg(g[y]).no-agg(g[x]).no);
  let h='<table><thead><tr><th class="l">战区</th>'+th()+'</tr></thead><tbody>';
  ks.forEach(z=>{h+='<tr><td class="l"><span class="nm">'+z+'</span></td>'+
    cells(agg(g[z]),scOf('zone',z),'zone',z)+'</tr>';});
  h+='<tr class="sum"><td class="l"><span class="nm">合计</span></td>'+
    cells(agg(WARES),scCity(),'city','')+'</tr></tbody></table>';
  document.getElementById('t_zone').innerHTML=h;}

function renderDist(){
  if(!HAS_GOAL)return;
  const g=groupBy(WARES,'d');
  const ks=Object.keys(g).sort((x,y)=>agg(g[y]).e-agg(g[x]).e);
  let h='<table><thead><tr><th class="l">行政区</th><th class="l">战区</th>'+
    th()+'</tr></thead><tbody>';
  ks.forEach(d=>{
    const a=agg(g[d]);
    // 一个行政区理论上只属一个战区；万一多个则全列出（不静默取第一个）
    const zs=[...new Set(g[d].map(r=>r.z))].join('/');
    h+='<tr><td class="l"><span class="nm">'+d+'</span></td>'+
      '<td class="l t">'+zs+'</td>'+
      cells(a,scOf('dist',d),'dist',d)+'</tr>';});
  h+='<tr class="sum"><td class="l" colspan="2"><span class="nm">合计</span></td>'+
    cells(agg(WARES),scCity(),'city','')+'</tr></tbody></table>';
  document.getElementById('t_dist').innerHTML=h;}

function renderOwner(){
  const g=groupBy(WARES,'z');
  const ks=Object.keys(g).sort((x,y)=>agg(g[y]).no-agg(g[x]).no);
  let h='<table><thead><tr><th class="l">战区</th><th class="l">G端负责人</th>'+
    th()+'</tr></thead><tbody>';
  ks.forEach(z=>{
    const go=groupBy(g[z],'o');
    const os=Object.keys(go).sort((x,y)=>agg(go[y]).no-agg(go[x]).no);
    os.forEach((o,i)=>{
      h+='<tr>'+(i===0?'<td class="zc" rowspan="'+os.length+'">'+z+'</td>':'')+
        '<td class="l"><span class="nm">'+o+'</span></td>'+
        cells(agg(go[o]),scOf('owner',o),'owner',o)+'</tr>';});});
  h+='<tr class="sum"><td class="l" colspan="2"><span class="nm">合计</span></td>'+
    cells(agg(WARES),scCity(),'city','')+'</tr></tbody></table>';
  document.getElementById('t_owner').innerHTML=h;}


// ---- 四、仓库（三组筛选 + 存量档位） ----
function tog(k){
  document.querySelectorAll('.fpan').forEach(p=>{if(p.id!=='p_'+k)p.classList.remove('show');});
  document.getElementById('p_'+k).classList.toggle('show');}
document.addEventListener('click',e=>{
  if(!e.target.closest('.fg'))document.querySelectorAll('.fpan').forEach(p=>p.classList.remove('show'));});
function pass(r,skip){for(const k in F){
  if(k===skip)continue;
  if(F[k].size&&!F[k].has(r[KEY[k]]))return false;}return true;}
function buildPanels(){
  for(const k in F){
    const other=WARES.filter(r=>pass(r,k));
    const cnt={};other.forEach(r=>{cnt[r[KEY[k]]]=(cnt[r[KEY[k]]]||0)+r.e[IDX];});
    const opts=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
    document.getElementById('p_'+k).innerHTML=opts.map(v=>
      '<label><input type="checkbox" '+(F[k].has(v)?'checked':'')+
      ' onchange="pick(\''+k+'\',this.value,this.checked)" value="'+v+'">'+
      v+'<span class="c">'+f0(cnt[v])+'</span></label>').join('');
    const b=document.getElementById('b_'+k);
    b.className='fbtn'+(F[k].size?' on':'');
    b.innerHTML=LB[k]+' <i>'+(F[k].size?F[k].size+' 项':'全部')+'</i>';}}
function pick(k,v,on){on?F[k].add(v):F[k].delete(v);render();}
function clr(){for(const k in F)F[k].clear();EFF_MIN=0;render();}
function setEff(v){EFF_MIN=v;render();}
function buildSteps(){
  document.getElementById('fsteps').innerHTML=EFF_STEPS.map(s=>
    '<button class="'+(EFF_MIN===s[0]?'on':'')+'" onclick="setEff('+s[0]+')">'+
    s[1]+'</button>').join('');}

// 仓库两张表用固定列宽（px），使「不可取」与「可取」上下逐列对齐；
// 卡点列给足宽度以整行不换行（实测最长16字≈206px，取215）
// 列宽按实测内容需求给（中文按字号估算 + 左右padding），不足会被 fixed 布局截断
// 战区72 行政区60 负责人74(表头更宽) 仓库256(最长20字) 三方74
// 数字列取表头需求(≥24年存量74/本月收车67)与数字63的较大者
const WCOL=[72,60,74,256,74,72,78,78,72,72,72,72];   // 前12列
const WCHG=90, WNOTE=218;   // 变化列(表头≥24年较上周85) / 卡点(最长213)
function wWidth(nb,note){
  return WCOL.reduce((a,b)=>a+b,0)+WCHG*nb+(note?WNOTE:0);}
function wcols(nb,note){
  return '<colgroup>'+WCOL.map(v=>'<col style="width:'+v+'px">').join('')+
    Array(nb).fill('<col style="width:'+WCHG+'px">').join('')+
    (note?'<col style="width:'+WNOTE+'px">':'')+'</colgroup>';}

// 两张表列结构统一（都含卡点列），故不再需要 showNote 参数
function wtbl(rows){
  const B=bases(), MI=monthIdx();
  const a={n:rows.length,st:0,e:0,y:0,sd:0,sm:0,qd:0,qm:0,c:B.map(()=>0)};
  const R=rows.map(r=>{
    let qm=0,sm=0;MI.forEach(i=>{qm+=r.q[i];sm+=r.s[i];});
    const o={z:r.z,d:r.d,o:r.o,p:r.p,w:r.w,n:r.n,st:r.st[IDX],e:r.e[IDX],y:r.y[IDX],
             qd:r.q[IDX],qm:qm,sd:r.s[IDX],sm:sm,
             c:B.map(b=>r.e[IDX]-r.e[b[1]])};
    a.st+=o.st;a.e+=o.e;a.y+=o.y;a.sd+=o.sd;a.sm+=o.sm;a.qd+=o.qd;a.qm+=o.qm;
    o.c.forEach((v,i)=>a.c[i]+=v);
    return o;});
  // ⭐两张表列结构完全一致（卡点列都保留，可取仓无卡点显示「—」），
  //   配 table-layout:fixed + colgroup 固定列宽 → 上下逐列对齐
  const NC=15+B.length;
  const TW=wWidth(B.length,true);
  let h='<table class="wtb" style="width:'+TW+'px">'+wcols(B.length,true)+
    '<thead><tr><th>战区</th><th>行政区</th><th class="l">G端负责人</th>'+
    '<th class="l">仓库</th><th>三方</th><th class="g1">总存量</th>'+
    '<th class="g2">≥24年存量</th><th class="g3">≥25年存量</th>'+
    '<th class="g5">当日收车</th><th class="g5">本月收车</th>'+
    '<th class="g4">当日取车</th><th class="g4">本月取车</th>'+
    B.map(b=>'<th>≥24年'+b[0]+'</th>').join('')+
    '<th class="l">卡点</th></tr></thead><tbody>';
  if(!R.length){h+='<tr><td colspan="'+NC+'" style="color:#94a3b8;padding:14px">'+
    '当前筛选下无数据</td></tr>';}
  R.sort((x,y)=>y.e-x.e).forEach(r=>{
    h+='<tr><td>'+r.z+'</td><td>'+r.d+'</td><td class="l">'+r.o+'</td>'+
       '<td class="l"><span class="nm">'+r.w+'</span></td><td>'+r.p+'</td>'+
       '<td class="t">'+f0(r.st)+'</td><td class="e">'+f0(r.e)+'</td>'+
       '<td class="y">'+f0(r.y)+'</td>'+
       '<td class="s">'+f0(r.sd)+'</td><td class="s">'+f0(r.sm)+'</td>'+
       '<td class="q">'+f0(r.qd)+'</td><td class="q">'+f0(r.qm)+'</td>'+
       r.c.map(v=>'<td>'+sgn(v)+'</td>').join('')+
       '<td class="note" title="'+(r.n||'')+'">'+(r.n||'—')+'</td></tr>';});
  h+='<tr class="sum"><td class="l" colspan="5">合计 '+a.n+' 仓</td>'+
     '<td class="t">'+f0(a.st)+'</td><td class="e">'+f0(a.e)+'</td>'+
     '<td class="y">'+f0(a.y)+'</td><td class="s">'+f0(a.sd)+'</td>'+
     '<td class="s">'+f0(a.sm)+'</td><td class="q">'+f0(a.qd)+'</td>'+
     '<td class="q">'+f0(a.qm)+'</td>'+
     a.c.map(v=>'<td>'+sgn(v)+'</td>').join('')+
     '<td></td></tr></tbody></table>';
  return h;}

function renderWares(){
  const cur=WARES.filter(r=>pass(r,null));
  const noAll=cur.filter(r=>r.ok==='否'), canAll=cur.filter(r=>r.ok==='是');
  // 存量档位只影响行展示（EFF_MIN=0 即全部显示），不改任何汇总口径
  const no=noAll.filter(r=>r.e[IDX]>=EFF_MIN), can=canAll.filter(r=>r.e[IDX]>=EFF_MIN);
  function hint(all,shown){
    const h=all.length-shown.length;
    if(!h)return '';
    const he=all.filter(r=>r.e[IDX]<EFF_MIN).reduce((s,r)=>s+r.e[IDX],0);
    return '<span style="font-weight:400;color:#94a3b8;font-size:12px">'+
      '（按存量筛选，另有 '+h+' 个仓＜'+f0(EFF_MIN)+' 未列，合计 '+f0(he)+' 辆）</span>';}
  document.getElementById('t_no').innerHTML=
    '<div style="font-size:13.5px;font-weight:700;color:#b91c1c;margin-bottom:7px">'+
    '🔴 不可取（被卡）'+no.length+' 仓'+hint(noAll,no)+'</div>'+wtbl(no);
  document.getElementById('t_can').innerHTML=
    '<div style="font-size:13.5px;font-weight:700;color:#15803d;margin-bottom:7px">'+
    '✅ 可取 '+can.length+' 仓'+hint(canAll,can)+'</div>'+wtbl(can);
  const a=agg(cur), en=noAll.reduce((s,r)=>s+r.e[IDX],0);
  const MI=monthIdx();
  let qm=0,sm=0;cur.forEach(r=>MI.forEach(i=>{qm+=r.q[i];sm+=r.s[i];}));
  document.getElementById('fsum').innerHTML='当前 <b>'+cur.length+'</b> 仓｜≥24年存量 <b>'+
    f0(a.e)+'</b>｜其中不可取 <b>'+f0(en)+'</b>（'+pct(en,a.e)+'）｜本月收车(按仓归集) <b>'+
    f0(sm)+'</b>｜本月取车 <b>'+f0(qm)+'</b>';}


// ---- 摘要 / KPI / 日期条 ----
function renderLead(){
  const a=agg(WARES), sc=scCity(), B=bases(), MI=monthIdx();
  const bm=B.length?B[B.length-1]:null;
  const em=bm?a.c[B.length-1]:0;
  const lbm=bm?B[B.length-1][0]:'';
  const noRows=WARES.filter(r=>r.ok==='否');
  document.getElementById('lead').innerHTML=
    '可释放盘子（≥24年存量）<b>'+f0(a.e)+'</b> 辆'+
    (GOAL?('，本周目标 <b>'+f0(GOAL.city)+'</b>（'+GOAL.week+'）——<em>'+
      md(DATES[IDX])+' 单日达成率 '+rateTxt(GOAL.city,a.e)+'，'+
      (a.e<=GOAL.city?'已达成，富余 ':'未达成，超出 ')+f0(Math.abs(a.e-GOAL.city))+
      ' 辆</em>'):'')+
    '，其中 <em>不可取 '+f0(a.no)+
    ' 辆、占 '+pct(a.no,a.e)+'</em>，可取仅 '+f0(a.can)+' 辆'+
    (bm?('；'+lbm+' 变化 '+(em>0?'+':'')+f0(em)):'')+'。<br>'+
    '不可取的车里 <span class="nw">≥25年新车 '+f0(a.y_no)+' 辆、占 '+
    pct(a.y_no,a.no)+'</span>——卡住的基本都是好车。<br>'+
    '本月<b>收车 '+f0(sc.m)+'</b> 辆（当日 '+f0(sc.d)+'）、<b>取车 '+f0(a.qm)+
    '</b> 辆（当日 '+f0(a.qd)+'）'+
    (bm?('，同期 ≥24年存量'+(em>0?'增加':'减少')+' '+f0(Math.abs(em))+' 辆——<em>'+
      (em>0?'进仓快于取车、存量仍在累积':'取车已快于进仓')+'</em>'):'')+'。';
  const B2=bases();
  const emNo=B2.length?noRows.reduce((s,r)=>s+(r.e[IDX]-r.e[B2[B2.length-1][1]]),0):0;
  const yCan=WARES.filter(r=>r.ok==='是').reduce((s,r)=>s+r.y[IDX],0);
  const nNo=noRows.length, nCan=WARES.filter(r=>r.ok==='是').length;
  const K=[
    ['b',f0(a.e),'≥24年存量（辆）','总存量 '+f0(a.st)],
    ['r',f0(a.no),'不可取 · '+pct(a.no,a.e),
     nNo+' 仓 ｜ '+(bm?lbm+' '+(emNo>0?'+':'')+f0(emNo):'—')],
    ['p',f0(a.y_no),'不可取的≥25年 · 占 '+pct(a.y_no,a.no),'卡住的基本都是好车'],
    ['g',f0(a.can),'可取 · '+pct(a.can,a.e),nCan+' 仓 ｜ ≥25年 '+f0(yCan)],
    ['s',f0(sc.m),'本月收车（辆）','当日 '+f0(sc.d)],
    ['o',f0(a.qm),'本月取车（'+MI.length+'天）',
     '当日 '+f0(a.qd)+' ｜ 日均 '+f0(a.qm/MI.length)],
  ];
  // ⭐目标KPI插到第2位（紧跟≥24年存量），反向指标：实际≤目标才达成
  if(GOAL){
    const t=GOAL.city, gap=a.e-t, ok=gap<=0;
    K.splice(1,0,[ok?'g':'r',rateTxt(t,a.e),
      md(DATES[IDX])+' 单日达成率（目标 '+GOAL.week+'）',
      '目标 '+f0(t)+' ｜ 当日实际 '+f0(a.e)+' ｜ '+
      (ok?'已达成 富余':'未达成 超出')+' '+f0(Math.abs(gap))+' 辆']);}
  document.getElementById('kpis').innerHTML=K.map(k=>
    '<div class="k '+k[0]+'"><div class="v">'+k[1]+'</div><div class="l">'+k[2]+
    '</div><div class="d">'+k[3]+'</div></div>').join('');}

function buildDates(){
  document.getElementById('dsel').innerHTML=DATES.map((d,i)=>
    '<option value="'+i+'"'+(i===IDX?' selected':'')+'>'+fmt(d)+
    (i===DATES.length-1?'（最新）':'')+'</option>').join('');
  document.getElementById('prev').disabled=(IDX===0);
  document.getElementById('next').disabled=(IDX===DATES.length-1);
  const B=bases();
  document.getElementById('dinfo').innerHTML='当前 <b>'+fmt(DATES[IDX])+'</b>｜对比基准 '+
    (B.length?B.map(b=>b[0]+' '+fmt(DATES[b[1]])).join('、'):'无（已是最早一天）')+
    '｜本月累计 '+monthIdx().length+' 天';
  const cur=DATES[IDX];
  // 快捷按钮：高亮当前所在位置（最新/月初等），其余按钮为"跳到该基准日"
  document.getElementById('q_last').className='qk'+(IDX===DATES.length-1?' on':'');
  document.getElementById('q_mon').className='qk'+
    (DATES[IDX]===cur.slice(0,6)+'01'?' on':'');
  document.getElementById('q_yest').className='qk';
  document.getElementById('q_week').className='qk';}

function jump(kind){
  const cur=DATES[IDX];
  let i=IDX;
  if(kind==='last')i=DATES.length-1;
  else if(kind==='yest')i=pickIdx(shift(cur,-1));
  else if(kind==='week')i=pickIdx(shift(cur,-7));
  else if(kind==='mon')i=pickIdx(cur.slice(0,6)+'01');
  if(i>=0)setIdx(i);}
function setIdx(i){IDX=Math.max(0,Math.min(DATES.length-1,i));render();}
function step(n){setIdx(IDX+n);}

function render(){
  pickGoalWeek();     // ⭐先按所选单日定目标周，再渲染各表的目标/达成率
  buildDates();renderLead();renderCity();renderZone();renderOwner();
  renderDist();renderWares();buildPanels();buildSteps();}
render();

</script>
</div></body></html>
