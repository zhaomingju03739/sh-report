/* ===== 行政区底色：按"当前筛选后"各区未备案量着色 =====
   分档改为相对当前最大值(而非写死100/50/20)，否则切到"本轮预警"这类小数量视图时

var BANDS=[];
function makeBands(max){
  if(max<=0){BANDS=[];return;}
  var q=[Math.ceil(max*0.75),Math.ceil(max*0.5),Math.ceil(max*0.25),1];
  /* 去重并保证递减，避免小数量时几档阈值相同 */
  var seen={},out=[];
  q.forEach(function(v){if(v>=1&&!seen[v]){seen[v]=1;out.push(v);}});
  BANDS=out;
}

var BAND_FILL=["#a8071a","#f5222d","#ff7a45","#ffc069"];
var BAND_ALPHA=[0.40,0.30,0.22,0.16];
function bandIdx(n){
  for(var i=0;i<BANDS.length;i++){ if(n>=BANDS[i]) return Math.min(i,BAND_FILL.length-1); }
  return BAND_FILL.length-1;
}
function fillOf(n){ return n<=0 ? "#ffffff" : BAND_FILL[bandIdx(n)]; }
function fillAlpha(n){ return n<=0 ? 0 : BAND_ALPHA[bandIdx(n)]; }

function updateLegend(max){
  var box=document.getElementById("legend");
  if(!max){box.innerHTML="<b>各区未备案量</b><br>当前筛选无未备案";return;}
  var html="<b>各区未备案量</b>（区名标签底色）<br>";

    var lo=BANDS[i], hi=(i===0? max : BANDS[i-1]-1);
    var txt=(i===0? "≥"+lo : (lo===hi? lo : lo+"-"+hi));
    html+='<span class="lg" style="background:'+BAND_FILL[Math.min(i,BAND_FILL.length-1)]+'"></span>'+txt+"辆<br>";

      var on=keep.indexOf(v)>=0 ? " checked" : "";
      return '<label><input type="checkbox" class="'+cls+'" value="'+v+'"'+on+'>'+label
             +'<span style="color:#94a3b8">('+cnt[v]+')</span></label>';
    }).join("");
    box.innerHTML = html || '<label style="color:#94a3b8">本视图无可选项</label>';
    box.querySelectorAll("."+cls).forEach(function(c){c.addEventListener("change",render);});
  });
}
function render(){
  var ds=sel(".fd"), ss=sel(".fs"), hs=sel(".fh");
  /* 本轮预警视图 = 命中区(a) ∩ 窗口内(w)，与钉钉播报文案口径一致；
     否则会把"窗口内全市未备案"都画上，出现地图有的区/街道播报里根本没提。 */
  var base=PTS.filter(function(p){ return VIEW!=="alert" || (p.w && p.a); });
  var f=base.filter(function(p){
    if(ds.length&&ds.indexOf(p.d)<0) return false;
    if(ss.length&&ss.indexOf(p.s)<0) return false;
    if(hs.length&&hs.indexOf(p.hr)<0) return false;
    return true;
  });
  syncOptions(base);
  var counts={};
  f.forEach(function(p){counts[p.d]=(counts[p.d]||0)+1;});
  var points=f.map(function(p){return {lnglat:[p.lng,p.lat],d:p.d,s:p.s,pos:p.pos,t:p.t};});
  if(cluster){cluster.setMap(null);cluster=null;}
  if(points.length){
    cluster=new AMap.MarkerCluster(map,points,{gridSize:60,
      renderClusterMarker:function(ctx){var s=style(ctx.count);var div=document.createElement("div");div.className="cl";
        div.style.width=s.size+"px";div.style.height=s.size+"px";div.style.background=s.c;div.style.fontSize="14px";div.innerHTML=ctx.count;
        ctx.marker.setContent(div);ctx.marker.setOffset(new AMap.Pixel(-s.size/2,-s.size/2));},
      renderMarker:function(ctx){var div=document.createElement("div");
        div.style.cssText="width:12px;height:12px;border-radius:50%;background:#d4380d;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)";
        ctx.marker.setContent(div);ctx.marker.setOffset(new AMap.Pixel(-6,-6));var d=ctx.data[0];
        function open(){var iw=new AMap.InfoWindow({content:"<b>"+(d.pos||"点位")+"</b><br>"+d.d+" · "+d.s+"<br>"+(d.t||"")+" · 未备案",offset:new AMap.Pixel(0,-8)});iw.open(map,d.lnglat);ctx.marker._iw=iw;}
        ctx.marker.on("mouseover",open); ctx.marker.on("click",open);
        ctx.marker.on("mouseout",function(){if(ctx.marker._iw)ctx.marker._iw.close();});}
    });
  }
  drawDistricts(counts);
  document.getElementById("cd").textContent=ds.length?"("+ds.length+")":"";
  document.getElementById("cs").textContent=ss.length?"("+ss.length+")":"";
  document.getElementById("ch").textContent=hs.length?"("+hs.length+")":"";
  document.getElementById("stat").textContent=(VIEW==="alert"?"本轮预警命中区 ":"今日全天全市 ")+"显示 "+f.length+" 辆未备案";
  /* 只按未备案点位定位视野；区名标注覆盖全市，若一起 setFitView 会被拉到全市尺度。
     ⚠️不要用 AMap.Bounds.extend()：2.0 里该方法不可靠，会产出 NaN 边界，
     进而让每次鼠标/缩放事件都抛 LngLat(NaN,NaN)，表现为底图不渲染且无法缩放。
     改为自己算 min/max，并校验有限数后再 setBounds。 */
  if(f.length){
    var minLng=Infinity,minLat=Infinity,maxLng=-Infinity,maxLat=-Infinity;
    f.forEach(function(p){
      if(p.lng<minLng)minLng=p.lng; if(p.lng>maxLng)maxLng=p.lng;
      if(p.lat<minLat)minLat=p.lat; if(p.lat>maxLat)maxLat=p.lat;
    });
    if(isFinite(minLng)&&isFinite(minLat)&&isFinite(maxLng)&&isFinite(maxLat)){
      if(maxLng-minLng<0.004){minLng-=0.002;maxLng+=0.002;}   /* 单点时给个最小跨度 */
      if(maxLat-minLat<0.004){minLat-=0.002;maxLat+=0.002;}
      map.setBounds(new AMap.Bounds([minLng,minLat],[maxLng,maxLat]),false,[40,40,40,40]);
    }
  }
}
/* 初始清单由 syncOptions 在首次 render 时重建并绑定事件，此处不再重复绑定 */
document.getElementById("clr").addEventListener("click",function(){document.querySelectorAll(".fd,.fs,.fh").forEach(function(c){c.checked=false;});render();});
document.querySelectorAll(".sgb").forEach(function(b){b.addEventListener("click",function(){
  VIEW=b.getAttribute("data-v");
  document.querySelectorAll(".sgb").forEach(function(x){x.classList.remove("on");});
  b.classList.add("on");
  render();
});});
document.querySelectorAll(".dd .ddbtn").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();var p=b.parentNode;var o=p.classList.contains("open");document.querySelectorAll(".dd").forEach(function(d){d.classList.remove("open");});if(!o)p.classList.add("open");});});
document.querySelectorAll(".ddpanel").forEach(function(p){p.addEventListener("click",function(e){e.stopPropagation();});});
document.addEventListener("click",function(){document.querySelectorAll(".dd").forEach(function(d){d.classList.remove("open");});});
render();
</script></body></html>
